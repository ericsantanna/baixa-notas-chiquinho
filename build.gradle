plugins {
    id 'groovy'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'org.beryx.jlink' version '3.1.1'
}

group = 'com.ericsantanna'
version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.groovy:groovy:4.0.14'
    implementation ('org.springframework.boot:spring-boot-starter-web') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
    }
    implementation 'io.projectreactor.netty:reactor-netty'
    implementation 'org.gebish:geb-core:7.0'
    implementation 'org.seleniumhq.selenium:selenium-firefox-driver:4.20.0'
    implementation "org.seleniumhq.selenium:selenium-chrome-driver:4.35.0"
    implementation 'org.seleniumhq.selenium:selenium-support:4.20.0'
    implementation 'io.github.bonigarcia:webdrivermanager:6.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.apache.groovy:groovy-json:4.0.14'
    implementation 'org.apache.groovy:groovy-yaml:4.0.28'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    // Browser tests need Chrome + network (driver download): opt in with ./gradlew test -PbrowserTests
    useJUnitPlatform {
        if (!project.hasProperty('browserTests')) {
            excludeTags 'browser'
        }
    }
}

jar {
    manifest {
        attributes 'Main-Class': 'com.ericsantanna.baixaNotasChiquinho.Main'
    }
}

